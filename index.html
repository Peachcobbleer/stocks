<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const Q=[150,250,400,650,1000,1600];
const S={day:1,cash:100,t:0,len:40,pay:4,fee:.02,insider:false,mode:'office',run:false,paper:15,hold:{},cost:{},phase:'work',sh:1,bt:0,sel:2,perks:[],debt:0,debtLeft:0,call:0,callT:0};
const stocks=[['PAPR',20,.012],['CLVR',12,.03],['PITT',8,.055],['VOID',3,.09]].map(a=>({n:a[0],p:a[1],b:a[1],v:a[2],h:[a[1]],o:a[1],tr:0,tl:0}));
const rn=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
const net=()=>S.cash+stocks.reduce((a,s,i)=>a+(S.hold[i]||0)*s.p,0);
let pend=[],nt=0,sfx;
function beep(f,d=.08){try{sfx=sfx||new AudioContext();const o=sfx.createOscillator(),g=sfx.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(sfx.destination);o.start();o.stop(sfx.currentTime+d)}catch(e){}}
function clk(up){try{sfx=sfx||new AudioContext();const n=sfx.sampleRate*.025|0,b=sfx.createBuffer(1,n,sfx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const q=sfx.createBufferSource(),f=sfx.createBiquadFilter(),g=sfx.createGain();f.type='highpass';f.frequency.value=up?2600:1400;g.gain.value=up?.25:.55;q.buffer=b;q.connect(f);f.connect(g);g.connect(sfx.destination);q.start()}catch(e){}}
addEventListener('pointerdown',()=>clk(0),true);addEventListener('pointerup',()=>clk(1),true);
function AC(){sfx=sfx||new AudioContext();if(sfx.state=='suspended')sfx.resume();return sfx}
let stepAlt=0;
function footstep(){try{const c=AC(),t=c.currentTime,sr=c.sampleRate;
  const mk=(len,att,pw)=>{const n=sr*len|0,b=c.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.min(1,i/(sr*att))*Math.pow(1-i/n,pw);return b};
  const L=(buf,type,f,q,g,rate)=>{const q2=c.createBufferSource(),fl=c.createBiquadFilter(),gn=c.createGain();q2.buffer=buf;q2.playbackRate.value=rate;fl.type=type;fl.frequency.value=f;fl.Q.value=q;gn.gain.value=g;q2.connect(fl);fl.connect(gn);gn.connect(c.destination);q2.start(t)};
  stepAlt^=1;const v=.85+Math.random()*.3;
  L(mk(.17,.022,2),'lowpass',230+Math.random()*80+stepAlt*30,.5,2.6*v,.9+Math.random()*.2);   /* muffled pad */
  L(mk(.13,.035,2.5),'bandpass',1400+Math.random()*500,.5,.07*v,1);                              /* fibre rustle */
  const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(70-stepAlt*8,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
  og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(.07*v,t+.015);og.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+.14)}catch(e){}}
let buzz=null;
function startBuzz(){if(buzz)return;try{const c=AC(),m=c.createGain(),lp=c.createBiquadFilter();m.gain.value=0;lp.type='lowpass';lp.frequency.value=2200;lp.connect(m);m.connect(c.destination);
  [[120,'sine',1],[240,'triangle',.55],[360,'sawtooth',.18],[480,'sine',.12]].forEach(a=>{const o=c.createOscillator(),g=c.createGain();o.type=a[1];o.frequency.value=a[0];g.gain.value=a[2];o.connect(g);g.connect(lp);o.start()});
  const n=c.sampleRate*2|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const ns=c.createBufferSource(),bp=c.createBiquadFilter(),ng=c.createGain();ns.buffer=b;ns.loop=true;bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.8;ng.gain.value=.12;ns.connect(bp);bp.connect(ng);ng.connect(lp);ns.start();
  m.gain.setTargetAtTime(.012,c.currentTime,.8);buzz=m}catch(e){}}
addEventListener('pointerdown',startBuzz,true);
function say(t){$('tick').textContent=t;$('news').innerHTML=('<div>'+t+'</div>')+$('news').innerHTML.split('</div>').slice(0,2).join('</div>')}
const NEWS={up:['posts record paperwork','CEO "feels great"','wins a government contract','rumored to be acquired'],dn:['faces an audit','CEO missing since Tuesday','recalls all staplers','sued by the basement']};

function tick(){
  stocks.forEach(s=>{
    if(--s.tl<=0){s.tr=rn()*s.v*.5;s.tl=3+(Math.random()*6|0)}
    s.p=Math.max(.5,+(s.p*Math.exp(s.tr+rn()*s.v*.7+(s.b-s.p)/s.b*.006+(s.bias||0))).toFixed(2));
    s.h.push(s.p);if(s.h.length>110)s.h.shift();
  });
  if(++nt%10==0){
    const s=stocks[Math.random()*4|0],d=Math.random()<.5?1:-1,real=Math.random()<.7?d:-d;
    const txt=s.n+' '+NEWS[d>0?'up':'dn'][Math.random()*4|0];
    pend.push({t:4,s,real,txt});
    if(S.insider)say('[TIP] '+txt+(real>0?' \u25B2':' \u25BC'));
  }
  pend.forEach(e=>{if(--e.t==0){e.s.tr=e.real*e.s.v*.8;e.s.tl=8;if(!S.insider)say(e.txt)}});
  pend=pend.filter(e=>e.t>0);
  ui();
}

/* ---------- 3D scene ---------- */
const R=new THREE.WebGLRenderer({canvas:$('g'),antialias:false});R.setPixelRatio(1);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0504);sc.fog=new THREE.Fog(0x0a0504,2.5,9);
const cam=new THREE.PerspectiveCamera(60,1,.1,40);
const M=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function TX(base,o={}){
  const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');

    P.z=Math.min(3.4,Math.max(-1.2,P.z));P.x=Math.min(3.4,Math.max(-3.4,P.x));if(P.z<-.1)P.x=Math.min(2.4,Math.max(-2,P.x));
    if(!tvFull){stepD+=Math.hypot(P.x-ox,P.z-oz);if(stepD>=.85){stepD=0;footstep()}}
    const cpt=Math.cos(pitch);tp=P.clone();tl=new THREE.Vector3(P.x+Math.sin(yw)*cpt*3,1.5+Math.sin(pitch)*3,P.z-Math.cos(yw)*cpt*3)}
  else{P.set(.4,1.5,.3);tp=new THREE.Vector3(.4+mx*.15,1.5+my*.05,.3);tl=new THREE.Vector3(.4+mx*1.2,1.5+my*.5,-3)}
  cp.lerp(tp,brk?.2:.08);cl.lerp(tl,brk?(ctr()?.6:.2):.08);cam.position.copy(cp);cam.lookAt(cl);cam.updateMatrixWorld();extras(dt,now);
  newsFrame(now/1000);guideTick();R.render(sc,cam);requestAnimationFrame(loop);
}
